name: CI

# 触发:推 main、给 PR、打 v* 标签(标签会额外走"出安装包并发 Release")、也可手动跑
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支/标签只保留最新一次运行,旧的自动取消,省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============ 1) 静态检查(Linux,快) ============
  # 注意:node-pty 只提供 darwin/win32 预编译,没有 linux-x64。它在 Linux 上会退化成
  # `node-gyp rebuild`(需要完整工具链、且慢),而 typecheck/lint/build 都不加载它,
  # 所以这里用 --ignore-scripts 跳过原生构建。esbuild 的平台二进制来自
  # optionalDependencies(@esbuild/linux-x64),不依赖安装脚本,vite build 照常可用。
  # 需要真正跑后端脚本(会 import node-pty)的验证一律放在 windows 任务里。
  static:
    name: 静态检查(tsc / eslint / vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖(跳过原生模块构建)
        run: npm ci --ignore-scripts
      # 工作流本身也要校验:改坏了(步骤顺序、--publish 参数、gh 通配符…)只会在下一个
      # 任务白跑一大轮后才暴露,这里用纯文本解析的校验器先拦住
      - name: 工作流自校验
        run: npm run validate:workflow
      - name: 类型检查
        run: npm run typecheck
      - name: 代码规范
        run: npm run lint
      - name: 前端构建
        run: npm run build
      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ============ 2) 离线回归(Windows,目标平台) ============
  # 五个旧脚本 + 完整历史 + 可靠性矩阵 51 条 + 批次 J/K/L 的三个离线回归(45 断言),
  # 以及界面级回归 audit:ui(用 Electron 隐藏窗口真实驱动界面,假 ssh2,无需真服务器)。
  test:
    name: 离线回归(npm test + audit:ui)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 离线回归套件
        run: npm test
      # UI 回归加载的是真实前端产物(server 只在 dist/ 存在时服务静态文件,否则首页 404),
      # 所以这一步必须先构建;Linux 的 static 任务虽然也构建,但产物不能跨任务直接用。
      - name: 前端构建(UI 回归需要 dist/)
        run: npm run build
      - name: 界面级回归(UI 审计)
        run: npm run audit:ui
      # 真机回归需要外部 SSH 服务器:配置仓库 secrets(SH_HOST/SH_USER/SH_PASS)后才会执行,
      # 未配置自动跳过(audit:real 自身也会跳过)。外部机器不可用不应阻断 CI,故 continue-on-error。
      - name: 真机回归(可选,需配置 SH_* secrets)
        continue-on-error: true
        env:
          SH_HOST: ${{ secrets.SH_HOST }}
          SH_USER: ${{ secrets.SH_USER }}
          SH_PASS: ${{ secrets.SH_PASS }}
        shell: bash
        run: |
          if [ -z "$SH_HOST" ]; then
            echo "未配置 SH_HOST/SH_USER/SH_PASS,跳过真机回归"
            exit 0
          fi
          npm run audit:real

  # ============ 3) 打包 + 打包版 GUI/安装包验证(Windows) ============
  package:
    name: 出包 + 打包版/安装包验证
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 打包应用目录(release/win-unpacked)
        run: npm run app
      # 用 CDP 驱动打包后的真实 ServerHub.exe:内置后端/数据目录、界面建服务器、
      # 合成 OS 拖放上传、拖到非投放区不导航走、单实例锁(无 SH_* secrets 时跳过真机相关断言)
      - name: 打包版 GUI 回归(audit:desktop)
        env:
          SH_HOST: ${{ secrets.SH_HOST }}
          SH_USER: ${{ secrets.SH_USER }}
          SH_PASS: ${{ secrets.SH_PASS }}
        run: npm run audit:desktop
      # 必须显式 --publish never(已封装进 npm run dist:nsis):electron-builder 检测到 CI
      # 环境、又能从 git remote 推断出 GitHub provider 时会**隐式尝试发布 Release**,没有
      # GH_TOKEN 就直接以 exit 1 失败(安装包其实已经生成)——本工作流的发版是自己用 gh 做的。
      - name: 生成 NSIS 安装包
        run: npm run dist:nsis
      # 静默安装 → 启动已安装的应用 → 种数据 → 覆盖安装 → 数据仍在 → 静默卸载 → 数据保留
      - name: 安装包回归(audit:installer)
        run: npm run audit:installer
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
          # 出包环节出问题却"没有产物可传"时必须报错,不能静默成功
          if-no-files-found: error

  # ============ 4) 打标签时把安装包发到 Release ============
  release:
    name: 发布 Release(仅 v* 标签)
    runs-on: windows-latest
    # 必须同时等 static:否则 typecheck/lint/build 挂了照样能把包发出去(static 与 package 是兄弟)
    needs: [static, package]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: 下载安装包产物
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: release
      # 防"包名版本与标签不一致":安装包文件名/元数据都取自 package.json 的 version,
      # 版本号忘了改就会出现 v1.3.2 标签里装着 1.2.2 的包,这里直接拦下。
      - name: 校验标签与 package.json 版本一致
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ("v$v" -ne $tag) {
            Write-Error "标签 $tag 与 package.json 版本 v$v 不一致,请先同步版本号再打标签"
            exit 1
          }
          Write-Host "版本一致: $tag"
      - name: 创建或更新 Release 并上传安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"

          # 探测 Release 是否已存在(不存在时 gh 返回非 0,属预期,不能当成失败)
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ServerHub $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { Write-Error "创建 Release $tag 失败(退出码 $LASTEXITCODE)"; exit 1 }
            Write-Host "已创建 Release $tag"
          } else {
            Write-Host "Release $tag 已存在,直接覆盖上传"
          }

          # PowerShell 不对原生命令做通配符展开(会把 release/*.exe 原样传给 gh),
          # 所以这里自己把文件列出来再逐个传参,避免"找不到文件"的发版失败。
          # 排除出包中途的临时卸载器(签名中断会残留,它同样叫 "ServerHub Setup *.exe")。
          $files = @(Get-ChildItem -Path release -File |
            Where-Object { ($_.Extension -in '.exe', '.blockmap') -and ($_.Name -notlike '*__uninstaller*') } |
            ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { Write-Error "release/ 产物不足(需要安装包与 blockmap):$($files -join ', ')"; exit 1 }

          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "上传资产失败(退出码 $LASTEXITCODE)"; exit 1 }

          # 上传后必须回头核对资产真的在 Release 里:否则"上传失败"会被随后的
          # gh release view(必然成功)掩盖成绿色,线上少资产却无人知道。
          # GitHub 会把资产名里的空格换成点,gh 客户端上传时用同一套净化规则匹配 --clobber。
          $names = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { Write-Error "读取 Release 资产失败(退出码 $LASTEXITCODE)"; exit 1 }
          $expected = @($files | ForEach-Object { (Split-Path $_ -Leaf) -replace ' ', '.' })
          $missing = @($expected | Where-Object { $names -notcontains $_ })
          if ($missing.Count -gt 0) { Write-Error "以下资产未出现在 Release 中:$($missing -join ', ')"; exit 1 }

          # 万一上游把 Release 建成了草稿(例如误注入了 GH_TOKEN 让 electron-builder 抢先建 draft),
          # 这里显式取消草稿,保证对外可见。
          $draft = gh release view $tag --json isDraft --jq '.isDraft'
          if ($draft -eq 'true') {
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { Write-Error '取消 Release 草稿状态失败'; exit 1 }
          }

          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
